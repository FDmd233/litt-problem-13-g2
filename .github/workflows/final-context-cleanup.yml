name: Final context cleanup

on:
  push:
    paths:
      - '.github/workflows/final-context-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean authorship
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for fn in ['paper/parts/p00.tex','Litt_Problem_13_G2_complete.tex']:
              p=Path(fn)
              s=p.read_text(encoding='utf-8')
              s=s.replace('\\author{OpenAI}', '\\author{Zhijie He}')
              s=s.replace('pdfauthor={OpenAI}', 'pdfauthor={Zhijie He}')
              p.write_text(s, encoding='utf-8')
          p=Path('README.md')
          s=p.read_text(encoding='utf-8')
          if '## Assistance' not in s:
              s=s.rstrip()+"\n\n## Assistance\n\nAI-assisted tools were used during exploration, checking, and manuscript preparation.\n"
          p.write_text(s, encoding='utf-8')
          PY
      - name: Compile manuscript
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: paper
          texlive_version: 2026
      - name: Install audit tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils ripgrep
      - name: Install rebuilt PDF and audit
        run: |
          mkdir -p output/pdf
          cp paper/main.pdf output/pdf/Litt_Problem_13_G2.pdf
          sha256sum output/pdf/Litt_Problem_13_G2.pdf > SHA256SUMS.txt
          pdfinfo output/pdf/Litt_Problem_13_G2.pdf | grep -F 'Author:          Zhijie He'
          pdftotext output/pdf/Litt_Problem_13_G2.pdf /tmp/paper.txt
          if rg -n -i 'OpenAI|ChatGPT|GPT[- ]?[0-9]|Claude|Astra|Aristotle|undergraduate|thesis|defense|public version|private version|our conversation|chat history|prompt' /tmp/paper.txt README.md paper/parts/p00.tex Litt_Problem_13_G2_complete.tex; then
            echo 'Forbidden context remains' >&2
            exit 1
          fi
      - name: Commit cleanup
        run: |
          rm -f .github/workflows/conversation-trace-audit.yml .github/workflows/final-context-cleanup.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use human authorship and remove tool attribution'
          git push
