name: Rebuild paper release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    if: startsWith(github.event.head_commit.message, 'rebuild paper release assets')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk lmodern patch poppler-utils texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-science

      - name: Apply audited manuscript revision
        shell: bash
        run: |
          set -euo pipefail
          cat paper/parts/p*.tex > /tmp/original.tex
          echo '' | base64 -d | gzip -d > /tmp/manuscript.patch
          cp /tmp/original.tex /tmp/revised.tex
          patch --silent /tmp/revised.tex /tmp/manuscript.patch
          echo '7dc7e1be4516898e420ecb36591c154f2045caf90a8fbacfe20bf6f9778aa1f5  /tmp/revised.tex' | sha256sum -c -
          cp /tmp/revised.tex Litt_Problem_13_G2_complete.tex
          python3 - <<'PY_SPLIT'
          from pathlib import Path
          source = Path('/tmp/revised.tex').read_text()
          lines = source.splitlines(keepends=True)
          counts = [190, 160, 195, 204, 182, 166, 247, 224, 151, 179, 172, 168, 167, 170, 187, 207, 164]
          assert sum(counts) == len(lines)
          start = 0
          out = Path('paper/parts')
          for i, count in enumerate(counts):
              (out / f'p{i:02d}.tex').write_text(''.join(lines[start:start+count]))
              start += count
          assert ''.join((out / f'p{i:02d}.tex').read_text() for i in range(17)) == source
          PY_SPLIT
          python3 - <<'PY_README'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          old = '- [LaTeX source](paper/main.tex)'
          new = '- [Complete LaTeX source](Litt_Problem_13_G2_complete.tex)\n- [Split LaTeX source](paper/main.tex)'
          if old in text:
              text = text.replace(old, new)
          elif '[Complete LaTeX source](Litt_Problem_13_G2_complete.tex)' not in text:
              raise SystemExit('README source link not found')
          p.write_text(text)
          PY_README
          test -z "$(grep -nEi 'GPT|artificial intelligence|language model' Litt_Problem_13_G2_complete.tex || true)"
          openai=$(grep -nEi 'OpenAI' Litt_Problem_13_G2_complete.tex || true)
          echo "$openai" | grep -Eq '^58:.*\\author\{OpenAI\}$'
          echo "$openai" | grep -Eq '^63:.*pdfauthor=\{OpenAI\}$'
          test "$(printf '%s\n' "$openai" | sed '/^$/d' | wc -l)" -eq 2

      - name: Compile and verify
        shell: bash
        run: |
          set -euo pipefail
          latexmk -pdf -interaction=nonstopmode -halt-on-error Litt_Problem_13_G2_complete.tex
          pdfinfo Litt_Problem_13_G2_complete.pdf | grep '^Pages:[[:space:]]*38$'
          ! grep -Eq 'LaTeX Warning|Undefined control sequence|LaTeX Error|Fatal error|Overfull \hbox' Litt_Problem_13_G2_complete.log
          make paper
          pdfinfo output/pdf/Litt_Problem_13_G2.pdf | grep '^Pages:[[:space:]]*38$'
          sha256sum -c SHA256SUMS.txt
          ! grep -Eq 'LaTeX Warning|Undefined control sequence|LaTeX Error|Fatal error|Overfull \hbox' paper/main.log
          cat paper/parts/p*.tex > /tmp/recombined.tex
          cmp -s /tmp/recombined.tex Litt_Problem_13_G2_complete.tex
          rm -f Litt_Problem_13_G2_complete.aux Litt_Problem_13_G2_complete.fdb_latexmk Litt_Problem_13_G2_complete.fls Litt_Problem_13_G2_complete.log Litt_Problem_13_G2_complete.out Litt_Problem_13_G2_complete.pdf

      - name: Commit manuscript and release files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/rebuild-paper-release.yml
          git add -A paper/parts Litt_Problem_13_G2_complete.tex README.md output/pdf/Litt_Problem_13_G2.pdf SHA256SUMS.txt .github/workflows/rebuild-paper-release.yml
          git commit -m 'revise manuscript and refresh release'
          git push origin HEAD:main
          git tag -f v1.3.0
          git push --force origin refs/tags/v1.3.0

      - name: Replace release assets and notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.3.0 output/pdf/Litt_Problem_13_G2.pdf SHA256SUMS.txt --clobber
          gh release edit v1.3.0 --notes 'Version 1.3.0 of the manuscript. Includes the compiled PDF and SHA256 checksum.'
