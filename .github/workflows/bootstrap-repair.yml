name: Bootstrap revised G2 paper

on:
  push:
    branches:
      - agent/repair-shifted-g2
    paths:
      - .repair/v2.ready

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct audited source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .repair/v2.chunk.* | base64 -d > /tmp/g2-repair.tar.gz
          echo '66ee3e543a7611adbedd8838ba0b812e189742541d7924f30a7baee7cb833cf1  /tmp/g2-repair.tar.gz' | sha256sum -c -
          tar -xzf /tmp/g2-repair.tar.gz -C .
          rm -rf code/generated
          rm -f code/g2_mu6_*

      - name: Verify exact certificate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python code/g2_shifted_norm_certificate.py > /tmp/certificate.out
          diff -u code/g2_shifted_norm_certificate.out /tmp/certificate.out

      - name: Build paper
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended lmodern
          make paper
          grep -E 'LaTeX Warning|Package .* Warning|undefined citations|undefined references|Overfull|Underfull' paper/main.log && exit 1 || true
          sha256sum -c SHA256SUMS.txt

      - name: Commit reconstructed revision
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .repair
          rm -f .github/workflows/bootstrap-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Revise G2 construction with shifted cyclic cover'
          git push origin HEAD:agent/repair-shifted-g2
