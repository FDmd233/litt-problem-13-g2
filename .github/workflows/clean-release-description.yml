name: Clean release description

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-release-description.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update release and keep tag aligned
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/367729170" \
            -f tag_name='v1.3.0' \
            -f name='A Realization of G2 for Litt Problem No. 13' \
            -f body='Version 1.3.0 of the manuscript. Includes the compiled PDF and SHA256 checksum.' \
            -F draft=false \
            -F prerelease=false

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/clean-release-description.yml
          git commit -m "remove one-shot release cleanup"
          git push origin HEAD:main
          git tag -f v1.3.0 HEAD
          git push origin refs/tags/v1.3.0 --force
