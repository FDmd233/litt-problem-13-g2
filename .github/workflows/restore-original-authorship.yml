name: Restore original G2 authorship

on:
  push:
    paths:
      - '.github/workflows/restore-original-authorship.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source authorship
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for fn in ['paper/parts/p00.tex','Litt_Problem_13_G2_complete.tex']:
              p=Path(fn)
              s=p.read_text(encoding='utf-8')
              s=s.replace('\\author{Zhijie He}', '\\author{OpenAI}')
              s=s.replace('pdfauthor={Zhijie He}', 'pdfauthor={OpenAI}')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Compile manuscript
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: paper
          texlive_version: 2026
      - name: Install and verify PDF
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p output/pdf /tmp/g2-qa
          cp paper/main.pdf output/pdf/Litt_Problem_13_G2.pdf
          sha256sum output/pdf/Litt_Problem_13_G2.pdf > SHA256SUMS.txt
          pdfinfo output/pdf/Litt_Problem_13_G2.pdf | grep -F 'Author:          OpenAI'
          pdftoppm -f 1 -singlefile -png -r 160 output/pdf/Litt_Problem_13_G2.pdf /tmp/g2-qa/page >/dev/null 2>&1
      - name: Upload visual QA
        uses: actions/upload-artifact@v4
        with:
          name: g2-authorship-qa
          path: /tmp/g2-qa/page.png
      - name: Refresh release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp Litt_Problem_13_G2_complete.tex /tmp/Litt_Problem_13_G2.tex
          for a in Litt_Problem_13_G2.pdf Litt_Problem_13_G2.tex SHA256SUMS.txt; do
            gh release delete-asset v1.3.0 "$a" -y || true
          done
          gh release upload v1.3.0 output/pdf/Litt_Problem_13_G2.pdf /tmp/Litt_Problem_13_G2.tex SHA256SUMS.txt --clobber
      - name: Commit restoration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/restore-original-authorship.yml
          git add paper/parts/p00.tex Litt_Problem_13_G2_complete.tex output/pdf/Litt_Problem_13_G2.pdf SHA256SUMS.txt
          git commit -m 'Restore original G2 authorship'
          git pull --rebase origin main
          git push
