name: Retag clean final state

on:
  push:
    branches: [main]
    paths:
      - '.finalize-tag'

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove one-shot files and move final tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .finalize-tag .github/workflows/retag-final.yml
          git commit -m "finalize clean release tag"
          git push origin HEAD:main
          git push --force origin HEAD:refs/tags/v1.3.0-final
