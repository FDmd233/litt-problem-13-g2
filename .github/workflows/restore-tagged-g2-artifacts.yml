name: Restore tagged G2 artifacts

on:
  push:
    paths:
      - '.github/workflows/restore-tagged-g2-artifacts.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore PDF and checksum from tagged snapshot
        shell: bash
        run: |
          git show 'v1.3.0:output/pdf/Litt_Problem_13_G2.pdf' > output/pdf/Litt_Problem_13_G2.pdf
          git show 'v1.3.0:SHA256SUMS.txt' > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Restore release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete-asset v1.3.0 Litt_Problem_13_G2.pdf -y
          gh release delete-asset v1.3.0 SHA256SUMS.txt -y
          gh release upload v1.3.0 output/pdf/Litt_Problem_13_G2.pdf SHA256SUMS.txt --clobber

      - name: Commit tagged artifacts and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/restore-tagged-g2-artifacts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore G2 tagged artifacts'
          git push
