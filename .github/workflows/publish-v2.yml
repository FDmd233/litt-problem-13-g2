name: Publish v2.0.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v2.yml"

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Publish v2.0.0 release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify release artifacts
        run: sha256sum -c SHA256SUMS.txt

      - name: Publish v2.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          Revised manuscript, September 30, 2026.

          This release supersedes v1.3.0 as the current public manuscript while retaining the earlier tagged release unchanged.

          Main changes:
          - extends the G2 realization from a nonempty Zariski-open set of general parameters to every allowed smooth parameter, using simultaneous resolution and nearby cycles;
          - refines the scheme-theoretic Abel inverse and base-change argument;
          - gives the explicit rational example E: y^2 = x^3 + 2, C: w^3 = y - 1;
          - records the minimal ambient-dimension consequence for the 7-dimensional representation;
          - includes the compiled PDF, complete LaTeX source, and SHA-256 checksums.

          The manuscript is signed OpenAI. OpenAI GPT-5.6 Sol was used during earlier drafting and checking, and OpenAI ChatGPT/Codex was used for the September 30 revision, examination of the arguments and references, and LaTeX checks. This statement records assistance and does not imply journal review or acceptance.
          EOF
          gh release create v2.0.0             output/pdf/Litt_Problem_13_G2.pdf             Litt_Problem_13_G2_complete.tex             SHA256SUMS.txt             --target "$GITHUB_SHA"             --title "A Realization of G2 for Litt Problem No. 13 - v2.0.0"             --notes-file /tmp/release-notes.md
