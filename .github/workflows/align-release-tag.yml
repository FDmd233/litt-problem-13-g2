name: Align release tag

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/align-release-tag.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align v1.3.0 with clean main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/align-release-tag.yml
          git commit -m "remove one-shot tag alignment"
          git push origin HEAD:main
          git tag -f v1.3.0 HEAD
          git push origin refs/tags/v1.3.0 --force
