name: Rename release tag

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-release-tag.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename tag and clean workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rename-release-tag.yml
          git commit -m "use standard release tag"
          git push origin HEAD:main
          final_sha="$(git rev-parse HEAD)"

          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref='refs/tags/v1.3.0' \
            -f sha="$final_sha"

          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/367729170" \
            -f tag_name='v1.3.0' \
            -f target_commitish='main'

          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.3.0-final"

          test "$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq 'length')" -eq 1
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/367729170" --jq '.tag_name')" = "v1.3.0"
          test "$(gh api "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq 'length')" -eq 1
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.3.0" --jq '.object.sha')" = "$final_sha"
