name: Refresh release assets

on:
  push:
    paths:
      - '.github/workflows/refresh-release-assets.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare release files
        run: |
          cp Litt_Problem_13_G2_complete.tex /tmp/Litt_Problem_13_G2.tex
          cp SHA256SUMS.txt /tmp/SHA256SUMS.txt
      - name: Refresh v1.3.0 assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.3.0 output/pdf/Litt_Problem_13_G2.pdf --clobber
          gh release upload v1.3.0 /tmp/Litt_Problem_13_G2.tex --clobber
          gh release upload v1.3.0 /tmp/SHA256SUMS.txt --clobber
      - name: Verify release asset digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pair in \
            'Litt_Problem_13_G2.pdf output/pdf/Litt_Problem_13_G2.pdf' \
            'Litt_Problem_13_G2.tex /tmp/Litt_Problem_13_G2.tex' \
            'SHA256SUMS.txt /tmp/SHA256SUMS.txt'; do
            set -- $pair
            NAME=$1
            FILE=$2
            LOCAL=$(sha256sum "$FILE" | awk '{print $1}')
            REMOTE=$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v1.3.0 --jq ".assets[] | select(.name==\"$NAME\") | .digest" | sed 's/^sha256://')
            test "$LOCAL" = "$REMOTE"
          done
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/refresh-release-assets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary release refresh workflow'
          git push
