name: Rebuild corrected manuscript PDF
on:
  push:
    branches: [main]
    paths:
      - 'Litt_Problem_13_G2_complete.tex'
      - 'Makefile'
      - 'verification/source_hygiene.py'
      - '.github/workflows/build-audited-pdf.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-pdf-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX and PDF inspection tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-science lmodern poppler-utils
      - name: Check authoritative manuscript source
        run: python3 verification/source_hygiene.py Litt_Problem_13_G2_complete.tex
      - name: Rebuild PDF and checksums
        run: make
      - name: Verify final build and PDF text
        run: |
          set -eu
          test -s output/pdf/Litt_Problem_13_G2.pdf
          if grep -E 'LaTeX Warning: There were undefined references|Citation .+ undefined|Reference .+ undefined|Undefined control sequence' build/Litt_Problem_13_G2_complete.log; then
            echo 'FAIL: unresolved TeX reference or command'
            exit 1
          fi
          pdfinfo output/pdf/Litt_Problem_13_G2.pdf | grep -E 'Pages:|Page size:|PDF version:'
          pdftotext output/pdf/Litt_Problem_13_G2.pdf /tmp/authoritative-paper.txt
          if grep -Ei 'as an AI language model|system prompt|developer instruction|assistant response|chain of thought' /tmp/authoritative-paper.txt; then
            echo 'FAIL: unexpected conversation text in final PDF'
            exit 1
          fi
          sha256sum --check SHA256SUMS.txt
      - name: Upload auditable PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: current-authoritative-paper
          path: output/pdf/Litt_Problem_13_G2.pdf
          if-no-files-found: error
      - name: Synchronize tracked PDF and checksums
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/pdf/Litt_Problem_13_G2.pdf SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild corrected manuscript PDF from authoritative TeX"
            git push origin HEAD:main
          fi
