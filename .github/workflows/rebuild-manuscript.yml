name: Rebuild manuscript and release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-science lmodern poppler-utils

      - name: Reassemble and verify sources
        run: |
          cat paper/parts/p*.tex > Litt_Problem_13_G2_complete.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error Litt_Problem_13_G2_complete.tex
          make
          ! grep -E "undefined references|multiply defined|Overfull|Underfull|LaTeX Error" Litt_Problem_13_G2_complete.log paper/main.log
          pdftotext Litt_Problem_13_G2_complete.pdf /tmp/full.txt
          pdftotext paper/main.pdf /tmp/split.txt
          cmp /tmp/full.txt /tmp/split.txt

      - name: Commit generated manuscript artifacts
        run: |
          rm -f .github/workflows/rebuild-manuscript.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Litt_Problem_13_G2_complete.tex output/pdf/Litt_Problem_13_G2.pdf SHA256SUMS.txt .github/workflows/rebuild-manuscript.yml
          git commit -m "rebuild manuscript artifacts"
          git push origin HEAD:main

      - name: Replace v1.3.0 release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git rev-parse HEAD)
          git tag -f v1.3.0 "$commit"
          git push --force origin refs/tags/v1.3.0
          gh release upload v1.3.0 output/pdf/Litt_Problem_13_G2.pdf SHA256SUMS.txt --clobber
