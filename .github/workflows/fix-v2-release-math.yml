name: Fix v2.0.0 release math

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-v2-release-math.yml"

permissions:
  contents: write

jobs:
  edit-release:
    runs-on: ubuntu-latest
    steps:
      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          Revised manuscript, September 30, 2026.

          This release supersedes v1.3.0 as the current public manuscript while retaining the earlier tagged release unchanged.

          Main changes:

          - extends the $G_2$ realization from a nonempty Zariski-open set of general parameters to every allowed smooth parameter, using simultaneous resolution and nearby cycles;
          - refines the scheme-theoretic Abel inverse and base-change argument;
          - gives the explicit rational example
            $$
            E:\ y^2=x^3+2,\qquad C:\ w^3=y-1;
            $$
          - records the minimal ambient-dimension consequence for the seven-dimensional representation $V_7$;
          - includes the compiled PDF, complete LaTeX source, and SHA-256 checksums.

          The revised main theorem gives
          $$
          \bigl(G(\operatorname{IC}_{X_b}),\omega(\operatorname{IC}_{X_b})\bigr)
          \simeq (G_2,V_7)
          $$
          for every allowed smooth parameter $b$.

          The manuscript is signed OpenAI. OpenAI GPT-5.6 Sol was used during earlier drafting and checking, and OpenAI ChatGPT/Codex was used for the September 30 revision, examination of the arguments and references, and LaTeX checks. This statement records assistance and does not imply journal review or acceptance.
          EOF
          gh release edit v2.0.0             --repo FDmd233/litt-problem-13-g2             --notes-file /tmp/release-notes.md
