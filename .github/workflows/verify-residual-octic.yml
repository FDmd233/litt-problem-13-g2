name: Independent residual-octic certificate
on:
  push:
    branches: [main]
    paths:
      - 'verification/verify_residual_octic.py'
      - 'verification/verify_generic_factor_ordering.py'
      - '.github/workflows/verify-residual-octic.yml'
      - 'Litt_Problem_13_G2_complete.tex'
      - 'paper/parts/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-exact-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned symbolic algebra
        run: python -m pip install 'sympy==1.14.0'
      - name: Independently reconstruct residual octic
        run: python verification/verify_residual_octic.py
      - name: Verify factor-ordering identity in generic parameters
        run: python verification/verify_generic_factor_ordering.py
      - name: Retain published PDF for independent page review
        uses: actions/upload-artifact@v4
        with:
          name: g2-paper-pdf-${{ github.sha }}
          path: output/pdf/Litt_Problem_13_G2.pdf
          if-no-files-found: error
          retention-days: 14
